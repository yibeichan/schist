name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Tell uv that the active Python (the one setup-python installed) is the
# install target — equivalent to passing `--system` to every uv pip call,
# but cannot be forgotten by future workflow edits.
env:
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    name: Licensing (REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: 0.5.24

      # Every file must name its copyright holder and license, in an SPDX
      # header or through REUSE.toml.
      - name: reuse lint
        run: uvx --from reuse==6.2.0 reuse lint

  cli:
    name: CLI (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Pin uv to the same version the maintainer uses locally so CI
          # and dev box install through identical resolver behavior.
          version: 0.5.24
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: Verify cli/uv.lock is in sync with cli/pyproject.toml
        working-directory: cli
        run: uv lock --check

      - name: Install CLI + pytest (via uv)
        run: uv pip install --system -e ./cli pytest

      - name: Configure git identity for subprocess tests
        run: |
          git config --global user.email "ci@schist.test"
          git config --global user.name "schist-ci"
          git config --global init.defaultBranch main

      - name: Run pytest (cli, including the viewer builder)
        run: python -m pytest cli/tests -v

  mcp-server:
    name: MCP server (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: 0.5.24
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: Install CLI (provides schist + schist-ingest for audit-script integration test)
        working-directory: ${{ github.workspace }}
        run: uv pip install --system -e ./cli

      # The tests' local `schist` wrapper (tests/local-schist-bin.ts) runs the
      # repo CLI from cli/.venv when it is complete, and otherwise falls back
      # to `uv run`, whose first sync can outlast a lock-helper wait. Create
      # the venv up front so no test depends on that.
      - name: Create cli/.venv for the test-local schist wrapper
        working-directory: ${{ github.workspace }}/cli
        env:
          UV_SYSTEM_PYTHON: "false"
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e .

      - name: Configure git identity for fixture vault commits
        run: |
          git config --global user.email "ci@schist.test"
          git config --global user.name "schist-ci"
          git config --global init.defaultBranch main

      # Node 22 ships npm 10; mcp-server/package.json requires npm >=11.11.0
      # through devEngines, so npm ci refuses to run under the bundled npm.
      - name: Upgrade npm
        working-directory: ${{ github.workspace }}
        run: npm install -g npm@11.17.0

      - name: Install deps
        run: npm ci

      - name: Type-check (tsc build)
        run: npm run build

      # Must run after the build step: tests/ and scripts/ import from dist/.
      - name: Type-check tests
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Run jest
        run: npm test
