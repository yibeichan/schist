name: Release

on:
  push:
    tags:
      # GitHub Actions tag filters use glob, NOT regex. In glob, `.` is a
      # literal character — no escape needed. The prior `\.` pattern was
      # interpreted as a literal backslash + any-char, so v0.2.0's tag push
      # didn't fire this workflow and we had to dispatch manually. The fixed
      # pattern matches semver like v0.1.0, v1.2.3-rc.1, v2.0.0-beta.1.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # Required for Trusted Publishing (OIDC)
      contents: read
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: pip install build

      - name: Build CLI wheel
        run: python -m build cli/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: cli/dist

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC); no long-lived token
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install and build MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npm run build

      # mcp-server/LICENSE is tracked and holds the AGPL text the package
      # declares; the root LICENSE is a summary of the repository's licenses. Refuse to publish
      # a tarball whose LICENSE is anything else.
      - name: Check the packed LICENSE is the AGPL text
        working-directory: mcp-server
        run: |
          npm pack --dry-run --json | jq -e 'any(.[0].files[]; .path == "LICENSE")' > /dev/null
          head -1 LICENSE | grep -qx 'GNU AFFERO GENERAL PUBLIC LICENSE'

      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Publish to npm
        working-directory: mcp-server
        run: npm publish --access public --provenance
