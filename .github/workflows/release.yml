name: Release

on:
  push:
    tags:
      # GitHub Actions tag filters use glob, NOT regex. In glob, `.` is a
      # literal character — no escape needed. The prior `\.` pattern was
      # interpreted as a literal backslash + any-char, so v0.2.0's tag push
      # didn't fire this workflow and we had to dispatch manually. The fixed
      # pattern matches semver like v0.1.0, v1.2.3-rc.1, v2.0.0-beta.1.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # Required for Trusted Publishing (OIDC)
      contents: read
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: pip install build

      - name: Build CLI wheel
        run: python -m build cli/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: cli/dist

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC); no long-lived token
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install and build MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npm run build

      - name: Copy LICENSE to mcp-server (included in published tarball)
        run: cp LICENSE mcp-server/

      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Publish to npm
        working-directory: mcp-server
        run: npm publish --access public --provenance
