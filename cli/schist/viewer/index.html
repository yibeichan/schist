<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Rendered note bodies and agent answers can carry markup that makes the
       browser fetch a URL (and with it whatever text was put in the URL).
       This policy confines every such fetch to this site; scripts and styles
       are left unrestricted. -->
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data:; media-src 'none'; frame-src 'none'; object-src 'none'; font-src 'self'; connect-src 'self'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>schist — knowledge graph</title>
  <link rel="icon" href="data:," />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e4ec;
      --muted: #6b7280;
      --accent: #7c6af7;
      --accent-dim: #4b45a0;
      --note: #5b9cf6;
      --concept: #f59e42;
      --link-default: #374151;
      --link-hover: #6b7280;
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }

    #app { display: flex; height: 100vh; }

    /* Sidebar */
    #sidebar {
      width: 300px; min-width: 220px; max-width: 400px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
      resize: horizontal;
    }
    #sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
    #sidebar-header h1 { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: 0.02em; }
    #sidebar-header p { font-size: 11px; color: var(--muted); margin-top: 2px; }
    /* Build status and Rebuild button: shown only when the server has /api/status */
    #build-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--muted); }
    #build-bar[hidden] { display: none; }
    #build-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
    #build-dot.fresh { background: #4caf7d; }
    #build-dot.stale { background: #e0a43a; }
    #build-status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #rebuild-btn {
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font: inherit; padding: 3px 8px; cursor: pointer;
    }
    #rebuild-btn:hover:not(:disabled) { border-color: var(--accent); }
    #rebuild-btn:disabled { opacity: 0.6; cursor: default; }

    #search-wrap { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    #search {
      width: 100%; padding: 7px 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 13px;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    #filter-wrap { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 3px 9px; border-radius: 12px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 11px; cursor: pointer;
    }
    .filter-btn.active { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }

    /* Result and connection rows are <button>s for keyboard access. Drop the
       browser's button look so they render as list rows; the rules below
       add each row's own padding and bottom border. */
    .result-item, .conn-item {
      appearance: none; display: block; width: 100%; margin: 0;
      background: transparent; color: inherit; font: inherit; text-align: left;
      border: 0; border-radius: 0;
    }
    .result-item:focus-visible, .conn-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    #results { flex: 1; overflow-y: auto; padding: 8px 0; }
    .result-item {
      padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .result-item:hover, .result-item.selected { background: var(--bg); }
    .result-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { background: var(--border); border-radius: 3px; padding: 1px 5px; font-size: 10px; }
    .status { font-style: italic; }

    #stats { padding: 8px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }

    /* Graph */
    #graph-wrap { flex: 1; position: relative; overflow: hidden; }
    #graph { width: 100%; height: 100%; }

    /* Detail panel */
    #detail {
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 320px; background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto; padding: 18px;
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 10;
    }
    #detail.open { transform: translateX(0); }
    #detail-close {
      position: absolute; top: 12px; right: 12px;
      background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; line-height: 1;
    }
    #detail h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; padding-right: 24px; }
    #detail-meta { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
    #detail-meta span { margin-right: 8px; }
    #detail-body { font-size: 12px; line-height: 1.65; color: #b0b4c0; overflow-wrap: anywhere; }
    #detail-body.plain { white-space: pre-wrap; }
    /* Rendered Markdown (see renderBody) */
    #detail-body > :first-child { margin-top: 0; }
    #detail-body h1, #detail-body h2, #detail-body h3, #detail-body h4 { color: var(--text); font-weight: 600; line-height: 1.3; margin: 16px 0 6px; padding: 0; }
    #detail-body h1 { font-size: 15px; } #detail-body h2 { font-size: 14px; }
    #detail-body h3 { font-size: 13px; } #detail-body h4 { font-size: 12px; }
    #detail-body p, #detail-body ul, #detail-body ol, #detail-body pre, #detail-body blockquote, #detail-body table { margin: 0 0 8px; }
    #detail-body ul, #detail-body ol { padding-left: 18px; }
    #detail-body li { margin: 2px 0; }
    #detail-body strong { color: var(--text); }
    #detail-body a { color: var(--accent); }
    #detail-body code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; background: var(--bg); border-radius: 3px; padding: 1px 4px; }
    #detail-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; overflow-x: auto; }
    #detail-body pre code { padding: 0; background: none; }
    #detail-body blockquote { border-left: 2px solid var(--border); padding-left: 10px; color: var(--muted); }
    #detail-body table { display: block; overflow-x: auto; border-collapse: collapse; }
    #detail-body th, #detail-body td { border: 1px solid var(--border); padding: 3px 6px; text-align: left; vertical-align: top; }
    #detail-body hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
    #detail-connections { margin-top: 14px; }
    #detail-connections h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .conn-item { font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .conn-item:hover { color: var(--accent); }
    .conn-type { font-size: 10px; color: var(--accent); margin-right: 6px; }

    /* Tooltip */
    #tooltip {
      position: absolute; pointer-events: none; display: none;
      background: var(--surface); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 6px; font-size: 12px;
      max-width: 200px; z-index: 20;
    }

    /* Legend */
    #legend {
      position: absolute; bottom: 14px; left: 14px;
      display: flex; gap: 12px; font-size: 11px; color: var(--muted);
      pointer-events: none;
    }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }
    .legend-note { background: var(--note); }
    .legend-concept { background: var(--concept); }

    /* Ask the vault: shown only when the server offers /api/agent/status */
    #ask-btn {
      margin-top: 8px; width: 100%; padding: 6px 10px;
      background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 6px;
      color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
    }
    #ask-btn[hidden] { display: none; }
    #ask-btn .badge { margin-left: 6px; }
    .badge { display: inline-block; min-width: 16px; padding: 0 5px; border-radius: 8px; background: #e0a43a; color: #111; font-size: 10px; font-weight: 600; line-height: 16px; text-align: center; }
    .badge[hidden] { display: none; }
    #ask {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: min(400px, 100%); background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transform: translateX(-100%); transition: transform 0.2s ease;
      z-index: 11;
    }
    #ask.open { transform: translateX(0); }
    #ask-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    #ask-head h2 { font-size: 14px; font-weight: 600; flex: 1; }
    #ask-model { font-size: 11px; color: var(--muted); }
    .ask-icon-btn { background: none; border: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .ask-icon-btn:hover { color: var(--text); }
    #ask-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .ask-tab { flex: 1; padding: 8px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
    .ask-tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .ask-pane { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; }
    .ask-pane[hidden] { display: none; }
    #ask-log:empty::before { content: "Ask about anything in the vault. Answers cite the notes they come from; click a citation to open it. The agent cannot change the vault: it can only propose a note or link for you to approve."; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .msg-user { margin: 4px 0 10px auto; max-width: 85%; width: fit-content; background: var(--accent-dim); border-radius: 10px 10px 2px 10px; padding: 7px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg-agent { margin: 0 0 16px; }
    .msg-steps { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .msg-steps summary { cursor: pointer; }
    .msg-steps div { padding: 1px 0; overflow-wrap: anywhere; }
    .msg-steps .live::after { content: " …"; }
    .msg-answer { font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
    .msg-answer.plain { white-space: pre-wrap; }
    .msg-answer > :first-child { margin-top: 0; }
    .msg-answer h1, .msg-answer h2, .msg-answer h3, .msg-answer h4 { font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    .msg-answer p, .msg-answer ul, .msg-answer ol, .msg-answer pre, .msg-answer blockquote, .msg-answer table { margin: 0 0 8px; }
    .msg-answer ul, .msg-answer ol { padding-left: 18px; }
    .msg-answer a { color: var(--accent); }
    .msg-answer code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--bg); border-radius: 3px; padding: 1px 4px; }
    .msg-answer pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; overflow-x: auto; }
    .msg-answer pre code { padding: 0; background: none; }
    .msg-error { color: #f08a7e; font-size: 12px; }
    .cite {
      appearance: none; display: inline; border: 0; margin: 0 1px; padding: 0;
      background: none; color: var(--note); font: inherit; font-size: 10px; vertical-align: super; line-height: 1; cursor: pointer;
    }
    .cite:hover { text-decoration: underline; }
    .cite.unknown, .src.unknown { color: var(--muted); text-decoration: line-through; cursor: help; }
    .msg-sources { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 11px; }
    .msg-sources:empty { display: none; }
    .src {
      appearance: none; display: block; width: 100%; text-align: left; border: 0; padding: 2px 0;
      background: none; color: var(--muted); font: inherit; cursor: pointer; overflow-wrap: anywhere;
    }
    .src b { color: var(--note); font-weight: 500; margin-right: 4px; }
    .src:hover:not(.unknown) { color: var(--text); }
    .proposal-chip { display: inline-block; margin: 4px 0; padding: 3px 8px; border: 1px solid #e0a43a; border-radius: 10px; background: none; color: #e0a43a; font: inherit; font-size: 11px; cursor: pointer; }
    #ask-form { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; }
    #ask-form[hidden] { display: none; }
    #ask-input {
      flex: 1; resize: none; min-height: 36px; max-height: 140px;
      padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font: inherit; font-size: 13px; outline: none;
    }
    #ask-input:focus { border-color: var(--accent); }
    #ask-input:disabled { opacity: 0.6; }
    #ask-send { padding: 8px 12px; background: var(--accent); border: none; border-radius: 6px; color: #fff; font: inherit; font-size: 12px; cursor: pointer; }
    #ask-send:disabled { opacity: 0.5; cursor: default; }
    #ask-send.stop { background: var(--border); color: var(--text); }
    #ask-note { padding: 0 14px 8px; font-size: 11px; color: var(--muted); }
    #ask-note:empty { display: none; }
    #proposals:empty::before { content: "No pending proposals. Ask the agent to save or link something and it will appear here for review."; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .proposal { border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .proposal h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
    .proposal .p-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; overflow-wrap: anywhere; }
    .proposal .p-why { font-size: 12px; margin-bottom: 6px; }
    .proposal pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: #8fd19e; }
    .proposal .p-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .proposal .p-actions .p-reject { background: var(--bg); color: var(--text); }
    .proposal .p-actions button { padding: 4px 12px; border-radius: 4px; font: inherit; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .proposal .p-actions .p-approve { background: var(--bg); border-color: #4caf7d; color: #8fd19e; }
    .proposal .p-result { font-size: 11px; color: var(--muted); flex: 1; overflow-wrap: anywhere; }
    .proposal .p-failed { font-size: 11px; color: #e57373; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>schist</h1>
      <p id="vault-name">knowledge graph</p>
      <div id="build-bar" hidden>
        <span id="build-dot"></span>
        <span id="build-status"></span>
        <button id="rebuild-btn" type="button">Rebuild</button>
      </div>
      <button id="ask-btn" type="button" hidden>Ask the vault<span id="ask-badge" class="badge" hidden></span></button>
    </div>
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Search notes…" autocomplete="off" />
    </div>
    <div id="filter-wrap">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="note">Notes</button>
      <button class="filter-btn" data-filter="concept">Concepts</button>
    </div>
    <div id="results"></div>
    <div id="stats"></div>
  </div>

  <div id="graph-wrap">
    <svg id="graph"></svg>
    <div id="detail">
      <button id="detail-close" aria-label="Close details" title="Close details">×</button>
      <h2 id="detail-title"></h2>
      <div id="detail-meta"></div>
      <div id="detail-body"></div>
      <div id="detail-connections"></div>
    </div>
    <div id="ask" aria-label="Ask the vault">
      <div id="ask-head">
        <h2>Ask the vault</h2>
        <span id="ask-model"></span>
        <button id="ask-new" class="ask-icon-btn" type="button" title="New chat" aria-label="New chat">⟲</button>
        <button id="ask-close" class="ask-icon-btn" type="button" title="Close" aria-label="Close">×</button>
      </div>
      <div id="ask-tabs">
        <button class="ask-tab active" type="button" data-pane="ask-log">Chat</button>
        <button class="ask-tab" type="button" data-pane="proposals">Proposals <span id="tab-badge" class="badge" hidden></span></button>
      </div>
      <div id="ask-log" class="ask-pane"></div>
      <div id="proposals" class="ask-pane" hidden></div>
      <div id="ask-note"></div>
      <form id="ask-form">
        <textarea id="ask-input" rows="1" placeholder="Ask about your notes…"></textarea>
        <button id="ask-send" type="submit">Ask</button>
      </form>
    </div>
    <div id="tooltip"></div>
    <div id="legend">
      <span><span class="legend-dot legend-note"></span>note</span>
      <span><span class="legend-dot legend-concept"></span>concept</span>
    </div>
  </div>
</div>

<!-- D3.js v7 (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<!-- lunr.js (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js" integrity="sha384-203J0SNzyqHby3iU6hzvzltrWi/M41wOP5Gu+BiJMz5nwKykbkUx8Kp7iti0Lpli" crossorigin="anonymous"></script>
<!-- marked (Markdown → HTML) and DOMPurify (sanitizes that HTML) for note bodies -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" integrity="sha384-JEyTNhjM6R1ElGoJns4U2Ln4ofPcqzSsynQkmEc/KGy6336qAZl70tDLufbkla+3" crossorigin="anonymous"></script>

<script>
(async () => {
  // ── Data loading ──────────────────────────────────────────────────────────
  let graphData, searchData;
  try {
    [graphData, searchData] = await Promise.all([
      fetch("graph.json").then(r => { if (!r.ok) throw new Error(`graph.json: HTTP ${r.status}`); return r.json(); }),
      fetch("search-index.json").then(r => { if (!r.ok) throw new Error(`search-index.json: HTTP ${r.status}`); return r.json(); }),
    ]);
  } catch (err) {
    document.getElementById("stats").textContent =
      `⚠ Failed to load viewer data: ${err.message}. Serve this directory over HTTP on the loopback interface (e.g. python3 -m http.server --bind 127.0.0.1).`;
    return;
  }

  const { nodes, links } = graphData;
  const { documents, store } = searchData;

  // ── lunr index ───────────────────────────────────────────────────────────
  // Notes are indexed on their full body (the store's copy; documents[].body
  // is a 500-char excerpt), concepts on their title and description, so a
  // search reaches every node the list can show.
  const idx = lunr(function () {
    this.ref("id");
    this.field("title", { boost: 10 });
    this.field("tags", { boost: 5 });
    this.field("body");
    documents.forEach(doc => this.add({ ...doc, body: store[doc.id]?.body ?? doc.body }));
    nodes.filter(n => n.type === "concept").forEach(n =>
      this.add({ id: n.id, title: n.label, tags: "", body: n.description || "" }));
  });

  // Every query word must match, ranked by lunr's score. The query is built
  // with idx.query, never parsed as lunr syntax, so input like `a:b` or a
  // leading `-` cannot throw. Words split on anything that is not a letter,
  // digit or underscore, and stop words are dropped as the index drops them
  // (a required "the" would match nothing). The last word also matches as a
  // prefix (the user may still be typing it), merged by score with the exact
  // hits; if neither matches, every word is retried with one typo.
  function queryTerms(q) {
    return q.split(/[^\p{L}\p{N}_]+/u)
      .map(w => lunr.trimmer(new lunr.Token(w.toLowerCase())))
      .filter(t => t.toString() && lunr.stopWordFilter(t))
      .map(t => t.toString());
  }
  function runSearch(terms, mode) {
    return idx.query(q => terms.forEach((term, i) => {
      const opts = { presence: lunr.Query.presence.REQUIRED };
      if (mode === "prefix" && i === terms.length - 1) {
        opts.wildcard = lunr.Query.wildcard.TRAILING;
        opts.usePipeline = false;
      }
      if (mode === "typo") {
        opts.editDistance = 1;
        opts.usePipeline = false;
      }
      q.term(term, opts);
    }));
  }
  function search(q) {
    const terms = queryTerms(q);
    if (!terms.length) return null;
    const best = new Map();
    for (const h of [...runSearch(terms, "exact"), ...runSearch(terms, "prefix")]) {
      if (!best.has(h.ref) || best.get(h.ref).score < h.score) best.set(h.ref, h);
    }
    const hits = best.size ? [...best.values()] : runSearch(terms, "typo");
    return hits.sort((a, b) => b.score - a.score);
  }

  // ── State ─────────────────────────────────────────────────────────────────
  let selectedId = null;
  let activeFilter = "all";
  let searchQuery = "";

  // ── DOM helpers — all vault-sourced values go through textContent only ────
  function el(tag, cls) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    return e;
  }
  function txt(tag, text, cls) {
    const e = el(tag, cls);
    e.textContent = text;
    return e;
  }

  // Note bodies and agent answers are Markdown. They are the one place vault
  // text becomes HTML, and only after DOMPurify sanitizes marked's output: no
  // scripts, event handlers or javascript: URLs survive. Only HTML is kept
  // (no SVG or MathML), and images, media, embeds and the legacy background
  // attribute are dropped, so rendering never fetches from another host; the
  // page's Content-Security-Policy blocks any such fetch that gets past this.
  // Links open in a new tab without a referrer. If either library failed to
  // load, the body is shown as plain text.
  const SANITIZE = {
    USE_PROFILES: { html: true },
    FORBID_TAGS: ["img", "picture", "source", "video", "audio", "iframe", "object", "embed", "style", "form", "input", "button"],
    FORBID_ATTR: ["style", "srcset", "background"],
  };
  if (window.DOMPurify) {
    DOMPurify.addHook("afterSanitizeAttributes", elem => {
      if (elem.tagName === "A" && elem.hasAttribute("href")) {
        elem.setAttribute("target", "_blank");
        elem.setAttribute("rel", "noopener noreferrer");
      }
    });
  }
  function renderBody(target, text) {
    if (window.marked && window.DOMPurify) {
      target.classList.remove("plain");
      target.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: false }), SANITIZE);
    } else {
      target.classList.add("plain");
      target.textContent = text;
    }
  }

  // ── Sidebar list ──────────────────────────────────────────────────────────
  const resultsEl = document.getElementById("results");
  const statsEl = document.getElementById("stats");

  function renderList() {
    let items = nodes.filter(n => {
      if (activeFilter !== "all" && n.type !== activeFilter) return false;
      return true;
    });

    const hits = searchQuery.trim() ? search(searchQuery) : null;
    if (hits) {
      // Best match first; a query with only stop words or punctuation
      // (hits === null) leaves the full list.
      const rank = new Map(hits.map((h, i) => [h.ref, i]));
      items = items.filter(n => rank.has(n.id));
      items.sort((a, b) => rank.get(a.id) - rank.get(b.id));
    } else {
      items.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    }

    // #2 XSS fix: build DOM nodes — no innerHTML interpolation of vault data
    const frag = document.createDocumentFragment();
    for (const n of items) {
      const row = el("button", "result-item" + (n.id === selectedId ? " selected" : ""));
      row.type = "button";
      row.setAttribute("data-id", n.id);
      row.appendChild(txt("div", n.label, "result-title"));

      const meta = el("div", "result-meta");
      const dateText = n.date || "";
      const statusText = n.status || n.type;
      const metaText = dateText ? `${dateText} · ${statusText}` : statusText;
      meta.appendChild(txt("span", metaText, "status"));
      for (const t of (n.tags || []).slice(0, 3)) {
        meta.appendChild(txt("span", t, "tag"));
      }
      row.appendChild(meta);

      row.addEventListener("click", () => selectNode(n.id));
      // keyboard: Enter/Space already fires click on <button>
      frag.appendChild(row);
    }
    resultsEl.replaceChildren(frag);

    statsEl.textContent = `${items.length} / ${nodes.length} items`;
  }

  // ── Filter buttons ────────────────────────────────────────────────────────
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      renderList();
    });
  });

  document.getElementById("search").addEventListener("input", e => {
    searchQuery = e.target.value;
    renderList();
  });

  // ── Detail panel ──────────────────────────────────────────────────────────
  const detail = document.getElementById("detail");

  function selectNode(id) {
    selectedId = id;
    renderList();
    highlightNode(id);
    showDetail(id);
  }

  function showDetail(id) {
    const node = nodes.find(n => n.id === id);
    if (!node) return;
    const meta = store[id] || {};

    // #1 XSS fix: all vault-sourced values set via textContent / setAttribute only
    document.getElementById("detail-title").textContent = node.label;

    const metaEl = document.getElementById("detail-meta");
    const metaFrag = document.createDocumentFragment();
    // Only show date if present — avoid leading " · status" when date is empty
    const detailDate = meta.date || "";
    const detailStatus = meta.status || node.type || "";
    const detailMetaText = detailDate ? `${detailDate} · ${detailStatus}` : detailStatus;
    if (detailMetaText) metaFrag.appendChild(txt("span", detailMetaText, "status"));
    for (const t of (meta.tags || [])) {
      metaFrag.appendChild(txt("span", t, "tag"));
    }
    metaEl.replaceChildren(metaFrag);

    // Use store body (full text) — documents[].body is truncated for lunr indexing only
    renderBody(document.getElementById("detail-body"), meta.body || node.description || "");

    const outgoing = links.filter(l => l.source === id || (l.source && l.source.id === id));
    const incoming = links.filter(l => l.target === id || (l.target && l.target.id === id));
    const allConns = [
      ...outgoing.map(l => ({ dir: "→", peer: l.target?.id || l.target, type: l.type })),
      ...incoming.map(l => ({ dir: "←", peer: l.source?.id || l.source, type: l.type })),
    ];

    const connEl = document.getElementById("detail-connections");
    if (allConns.length) {
      const connFrag = document.createDocumentFragment();
      connFrag.appendChild(txt("h3", "Connections"));
      for (const c of allConns) {
        const peer = nodes.find(n => n.id === c.peer);
        const row = el("button", "conn-item");
        row.type = "button";
        row.setAttribute("data-id", c.peer);
        row.appendChild(txt("span", `${c.dir} ${c.type}`, "conn-type"));
        row.appendChild(document.createTextNode(peer?.label || c.peer));
        row.addEventListener("click", () => selectNode(c.peer));
        connFrag.appendChild(row);
      }
      connEl.replaceChildren(connFrag);
    } else {
      connEl.replaceChildren();
    }

    detail.classList.add("open");
  }

  document.getElementById("detail-close").addEventListener("click", () => {
    detail.classList.remove("open");
    selectedId = null;
    renderList();
    highlightNode(null);
  });

  // ── D3 force graph ────────────────────────────────────────────────────────
  const svg = d3.select("#graph");
  const wrap = document.getElementById("graph-wrap");

  let width = wrap.clientWidth;
  let height = wrap.clientHeight;

  svg.attr("width", width).attr("height", height);

  const g = svg.append("g");

  svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", e => g.attr("transform", e.transform)));

  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(80).strength(0.4))
    .force("charge", d3.forceManyBody().strength(-180))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collision", d3.forceCollide(18));

  const linkG = g.append("g").attr("class", "links");
  const nodeG = g.append("g").attr("class", "nodes");

  const linkEl = linkG.selectAll("line")
    .data(links)
    .join("line")
    .attr("stroke", "var(--link-default)")
    .attr("stroke-width", 1.2)
    .attr("stroke-opacity", 0.6);

  const nodeEl = nodeG.selectAll("circle")
    .data(nodes)
    .join("circle")
    .attr("r", d => d.type === "concept" ? 7 : 5)
    .attr("fill", d => d.type === "concept" ? "var(--concept)" : "var(--note)")
    .attr("stroke", "var(--bg)")
    .attr("stroke-width", 1.5)
    .style("cursor", "pointer")
    .call(d3.drag()
      .on("start", (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on("end", (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    )
    .on("click", (event, d) => { event.stopPropagation(); selectNode(d.id); })
    .on("mouseover", (event, d) => {
      const tip = document.getElementById("tooltip");
      tip.style.display = "block";
      tip.style.left = (event.offsetX + 14) + "px";
      tip.style.top = (event.offsetY - 10) + "px";
      tip.textContent = d.label;
    })
    .on("mousemove", (event) => {
      const tip = document.getElementById("tooltip");
      tip.style.left = (event.offsetX + 14) + "px";
      tip.style.top = (event.offsetY - 10) + "px";
    })
    .on("mouseout", () => { document.getElementById("tooltip").style.display = "none"; });

  const labelEl = nodeG.selectAll("text")
    .data(nodes.filter(n => n.type === "concept"))
    .join("text")
    .text(d => d.label)
    .attr("font-size", 9)
    .attr("fill", "var(--muted)")
    .attr("dy", -10)
    .attr("text-anchor", "middle")
    .style("pointer-events", "none");

  simulation.on("tick", () => {
    linkEl
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    nodeEl.attr("cx", d => d.x).attr("cy", d => d.y);
    labelEl.attr("x", d => d.x).attr("y", d => d.y);
  });

  function highlightNode(id) {
    if (!id) {
      nodeEl.attr("opacity", 1);
      linkEl.attr("stroke-opacity", 0.6).attr("stroke", "var(--link-default)");
      return;
    }
    const connectedIds = new Set([id]);
    links.forEach(l => {
      const src = l.source?.id || l.source;
      const tgt = l.target?.id || l.target;
      if (src === id) connectedIds.add(tgt);
      if (tgt === id) connectedIds.add(src);
    });
    nodeEl.attr("opacity", d => connectedIds.has(d.id) ? 1 : 0.2);
    linkEl
      .attr("stroke-opacity", l => {
        const src = l.source?.id || l.source;
        const tgt = l.target?.id || l.target;
        return (src === id || tgt === id) ? 0.9 : 0.1;
      })
      .attr("stroke", l => {
        const src = l.source?.id || l.source;
        const tgt = l.target?.id || l.target;
        return (src === id || tgt === id) ? "var(--accent)" : "var(--link-default)";
      });
  }

  // Click background to deselect
  svg.on("click", () => {
    detail.classList.remove("open");
    selectedId = null;
    renderList();
    highlightNode(null);
  });

  // Resize
  new ResizeObserver(() => {
    width = wrap.clientWidth; height = wrap.clientHeight;
    svg.attr("width", width).attr("height", height);
    simulation.force("center", d3.forceCenter(width / 2, height / 2)).alpha(0.1).restart();
  }).observe(wrap);

  // ── Hooks for the Ask panel (separate script below) ──────────────────────
  window.schistViewer = {
    label: id => nodes.find(n => n.id === id)?.label ?? null,
    open: id => { if (nodes.some(n => n.id === id)) selectNode(id); },
    renderMarkdown: renderBody,
  };
  document.dispatchEvent(new Event("schist:ready"));

  // ── Init ──────────────────────────────────────────────────────────────────
  renderList();
  document.getElementById("vault-name").textContent =
    `${nodes.filter(n => n.type === "note").length} notes · ${nodes.filter(n => n.type === "concept").length} concepts`;

})();
</script>

<script>
// ── Rebuild button ──────────────────────────────────────────────────────────
// A local server may offer GET /api/status ({built_at, built_head, vault_head,
// viewer_current, building, pulls, last_pull}) and POST /api/rebuild, which needs the
// X-Schist-Rebuild header (a cross-site form cannot send it). On a spoke
// (`pulls`), a rebuild pulls from the hub first; last_pull {at, ok, message}
// says how that went, and a failed pull still rebuilds from the local vault. Served any other way — a plain static
// server, a copy of the site — /api/status fails and the bar stays hidden.
// This runs apart from the graph script, so a rebuild can repair a site
// whose data failed to load.
(function () {
  const bar = document.getElementById("build-bar");
  const dot = document.getElementById("build-dot");
  const statusEl = document.getElementById("build-status");
  const btn = document.getElementById("rebuild-btn");
  let busy = false, pulls = false;

  function ago(epochSeconds) {
    const s = Math.max(0, Math.round(Date.now() / 1000 - epochSeconds));
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    return `${Math.floor(s / 86400)} d ago`;
  }

  async function getStatus() {
    const r = await fetch("api/status", { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const st = await r.json();
    if (typeof st !== "object" || st === null || typeof st.built_at !== "number") throw new Error("not a build status");
    return st;
  }

  function show(st) {
    const behind = !!st.built_head && !!st.vault_head && st.built_head !== st.vault_head;
    const oldViewer = st.viewer_current === false;   // absent from servers that predate it
    const stale = behind || oldViewer;
    dot.className = stale ? "stale" : "fresh";
    dot.title = behind ? "The vault has commits this build does not include"
      : oldViewer ? "Built by an older version of the viewer; rebuild to update the page"
      : "Built from the current vault commit";
    pulls = !!st.pulls;
    const lp = st.last_pull && typeof st.last_pull === "object" ? st.last_pull : null;
    const lpNote = lp && !lp.ok ? (String(lp.message).startsWith("pull skipped") ? " · pull skipped" : " · pull failed") : "";
    statusEl.textContent = st.building ? "building…" : `built ${ago(st.built_at)}${stale ? " · stale" : ""}${lpNote}`;
    statusEl.title = `built ${new Date(st.built_at * 1000).toLocaleString()}` +
      (st.built_head ? `, from ${String(st.built_head).slice(0, 7)}` : "") +
      (st.vault_head ? `; vault at ${String(st.vault_head).slice(0, 7)}` : "") +
      (lp ? `\nlast pull (${ago(lp.at)}): ${lp.message}` : "");
    if (!busy) btn.disabled = !!st.building;
    bar.hidden = false;
  }

  async function refresh() {
    try { show(await getStatus()); } catch { if (!busy) bar.hidden = true; }
  }

  async function waitForBuild() {
    for (let i = 0; i < 60; i++) {
      await new Promise(res => setTimeout(res, 1000));
      try { if (!(await getStatus()).building) return true; } catch { return false; }
    }
    return false;
  }

  btn.addEventListener("click", async () => {
    busy = true;
    btn.disabled = true;
    statusEl.textContent = pulls ? "pulling, then rebuilding…" : "rebuilding…";
    statusEl.title = "";
    let r, body = {};
    try {
      r = await fetch("api/rebuild", { method: "POST", headers: { "X-Schist-Rebuild": "1" }, cache: "no-store" });
      try { body = await r.json(); } catch { /* no JSON body */ }
    } catch (err) {
      statusEl.textContent = "rebuild failed: server unreachable";
      busy = false; btn.disabled = false;
      return;
    }
    if (r.ok && body.ok !== false) { location.reload(); return; }
    if (r.status === 409) {
      statusEl.textContent = "a build is already running…";
      if (await waitForBuild()) { location.reload(); return; }
    } else if (r.status === 429) {
      statusEl.textContent = "rebuilt moments ago; try again shortly";
      setTimeout(refresh, 5000);
    } else {
      // Kept until the next periodic refresh; the log tail is in the tooltip.
      statusEl.textContent = `rebuild failed (HTTP ${r.status})`;
      if (body.log) statusEl.title = String(body.log);
      if (body.pull && body.pull.message) statusEl.title = `${body.pull.message}\n${statusEl.title}`;
    }
    busy = false;
    btn.disabled = false;
  });

  refresh();
  setInterval(refresh, 60000);
})();
</script>
<script>
// ── Ask the vault ───────────────────────────────────────────────────────────
// A local server may offer GET api/agent/status ({available, model, reason})
// and POST api/agent/chat, which streams server-sent events:
//   step {text} · token {text} · interim · proposal {id, title} · done · error {message}
// The agent only reads; it can file proposals (GET api/proposals, POST
// api/proposals/<id>/approve|reject), and nothing is written until approved
// here. Every POST carries X-Schist-Agent: 1, which a cross-site page cannot
// send. Served any other way, the status request fails and the button stays
// hidden. Answers render through the page's sanitized Markdown renderer;
// [[note-id]] citations become buttons inserted as DOM nodes afterwards.
(function () {
  const $ = id => document.getElementById(id);
  const btn = $("ask-btn"), panel = $("ask"), log = $("ask-log"), props = $("proposals");
  const form = $("ask-form"), input = $("ask-input"), send = $("ask-send"), note = $("ask-note");
  const HDR = { "Content-Type": "application/json", "X-Schist-Agent": "1" };
  const CITE = /\[\[([^\]\n]{1,300})\]\]/g;
  let history = [], controller = null, available = false;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ── status & proposals count ──
  async function status() {
    try {
      const r = await fetch("api/agent/status", { cache: "no-store" });
      if (!r.ok) throw 0;
      const st = await r.json();
      if (typeof st !== "object" || st === null || typeof st.available !== "boolean") throw 0;
      available = st.available;
      $("ask-model").textContent = st.model || "";
      note.textContent = st.available ? "" : (st.reason || "agent unavailable");
      input.disabled = !st.available;
      if (!controller) send.disabled = !st.available;
      btn.hidden = false;
    } catch { btn.hidden = true; }
  }

  async function loadProposals() {
    let list = [];
    try {
      const r = await fetch("api/proposals", { cache: "no-store" });
      if (r.ok) list = await r.json();
    } catch { /* keep the old list */ return; }
    if (!Array.isArray(list)) return;
    for (const b of [$("ask-badge"), $("tab-badge")]) {
      b.textContent = String(list.length);
      b.hidden = list.length === 0;
    }
    const frag = document.createDocumentFragment();
    for (const p of list) frag.appendChild(proposalCard(p));
    props.replaceChildren(frag);
  }

  function proposalCard(p) {
    const card = el("div", "proposal");
    card.appendChild(el("h3", null, p.title));
    card.appendChild(el("div", "p-meta",
      `${p.kind === "link" ? "new connection in" : "new note"} ${p.target} · ${new Date(p.created_at).toLocaleString()}`));
    if (p.rationale) card.appendChild(el("div", "p-why", p.rationale));
    if (p.question) card.appendChild(el("div", "p-meta", `asked: “${p.question}”`));
    card.appendChild(el("pre", null, p.diff || ""));
    const failed = p.status === "failed";
    if (failed) card.appendChild(el("div", "p-failed", `last attempt failed: ${p.output || "no output"}`));
    const actions = el("div", "p-actions");
    const ok = el("button", "p-approve", failed ? "Retry" : "Approve"), no = el("button", "p-reject", "Reject");
    ok.type = no.type = "button";
    const result = el("span", "p-result");
    actions.append(ok, no, result);
    card.appendChild(actions);
    async function decide(action) {
      ok.disabled = no.disabled = true;
      result.textContent = action === "approve" ? "writing…" : "rejecting…";
      try {
        const r = await fetch(`api/proposals/${encodeURIComponent(p.id)}/${action}`, { method: "POST", headers: HDR });
        const body = await r.json().catch(() => ({}));
        if (r.ok && body.ok) {
          result.textContent = action !== "approve" ? "rejected"
            : body.rebuilding ? "approved and committed; rebuilding the site"
            : "approved and committed; rebuild the site to see it";
          setTimeout(loadProposals, 1500);
          return;
        }
        result.textContent = `failed: ${body.reason || body.output || body.status || "HTTP " + r.status}`;
        result.title = body.output || "";
        if (action === "approve" && body.status === "failed") { setTimeout(loadProposals, 1500); return; }
      } catch { result.textContent = "failed: server unreachable"; }
      ok.disabled = no.disabled = false;
    }
    ok.addEventListener("click", () => decide("approve"));
    no.addEventListener("click", () => decide("reject"));
    return card;
  }

  // ── rendering an answer ──
  // Citations become numbered footnotes ([1], [2] …, one number per note)
  // with a Sources list under the answer. An id that is not in the graph is
  // struck through: the model invented it.
  function renderAnswer(target, sources, text) {
    const ids = [];
    const md = text.replace(CITE, (_, id) => {
      id = id.trim();
      let n = ids.indexOf(id);
      if (n < 0) n = ids.push(id) - 1;
      return `@@CITE${n}@@`;
    });
    const viewer = window.schistViewer;
    if (viewer) viewer.renderMarkdown(target, md);
    else { target.classList.add("plain"); target.textContent = md; }
    // An answer is model output, and a note the model read can steer it, so
    // a link in an answer could carry other notes' text in its URL behind
    // innocent link text. Show links as plain text with the full address;
    // citations ([[id]]) are the answer's only clickable references.
    for (const a of [...target.querySelectorAll("a")]) {
      const href = a.getAttribute("href") || "";
      const text = a.textContent;
      a.replaceWith(document.createTextNode(!href || text === href ? text : `${text} <${href}>`));
    }
    const label = id => viewer?.label(id) || null;
    const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT);
    const hits = [];
    while (walker.nextNode()) if (walker.currentNode.nodeValue.includes("@@CITE")) hits.push(walker.currentNode);
    for (const tn of hits) {
      const parts = tn.nodeValue.split(/@@CITE(\d+)@@/);
      const frag = document.createDocumentFragment();
      parts.forEach((part, i) => {
        if (i % 2 === 0) { if (part) frag.appendChild(document.createTextNode(part)); return; }
        const n = Number(part), id = ids[n], name = label(id);
        const b = el("button", "cite" + (name ? "" : " unknown"), `[${n + 1}]`);
        b.type = "button";
        b.title = name || `${id} — no note has this id; the model may have invented it`;
        if (name) b.addEventListener("click", () => viewer.open(id));
        frag.appendChild(b);
      });
      tn.replaceWith(frag);
    }
    const list = document.createDocumentFragment();
    ids.forEach((id, n) => {
      const name = label(id);
      const row = el("button", "src" + (name ? "" : " unknown"));
      row.type = "button";
      row.appendChild(el("b", null, `[${n + 1}]`));
      row.appendChild(document.createTextNode(name || id));
      row.title = name ? id : "No note has this id; the model may have invented it";
      if (name) row.addEventListener("click", () => viewer.open(id));
      list.appendChild(row);
    });
    sources.replaceChildren(list);
  }

  // ── chat ──
  function addTurn(question) {
    log.appendChild(el("div", "msg-user", question));
    const turn = el("div", "msg-agent");
    const steps = el("details", "msg-steps");
    steps.open = true;
    steps.appendChild(el("summary", null, "working"));
    const answer = el("div", "msg-answer");
    const sources = el("div", "msg-sources");
    turn.append(steps, answer, sources);
    log.appendChild(turn);
    return { turn, steps, answer, sources };
  }

  function scroll() { log.scrollTop = log.scrollHeight; }

  async function ask(question) {
    history.push({ role: "user", content: question });
    const t = addTurn(question);
    let text = "", pending = false, live = null, nsteps = 0;
    const step = s => {
      if (live) live.classList.remove("live");
      live = el("div", "live", s);
      t.steps.appendChild(live);
      nsteps++;
      scroll();
    };
    const paint = () => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; renderAnswer(t.answer, t.sources, text); scroll(); });
    };
    controller = new AbortController();
    send.textContent = "Stop"; send.classList.add("stop"); send.disabled = false;
    let finished = false, failed = null;
    try {
      const r = await fetch("api/agent/chat", {
        method: "POST", headers: HDR, signal: controller.signal,
        body: JSON.stringify({ messages: history }),
      });
      if (!r.ok) {
        const body = await r.json().catch(() => ({}));
        throw new Error(body.reason || `HTTP ${r.status}`);
      }
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let cut;
        while ((cut = buf.indexOf("\n\n")) >= 0) {
          const line = buf.slice(0, cut); buf = buf.slice(cut + 2);
          if (!line.startsWith("data: ")) continue;
          let ev;
          try { ev = JSON.parse(line.slice(6)); } catch { continue; }
          const kind = ev.type;
          if (kind === "step") step(ev.text);
          else if (kind === "token") { text += ev.text; paint(); }
          else if (kind === "interim") {
            // The text so far was the model narrating its plan, not the answer.
            if (text.trim()) step(text.trim().replace(CITE, "$1").slice(0, 300));
            text = ""; paint();
          } else if (kind === "proposal") {
            const chip = el("button", "proposal-chip", `proposal filed: ${ev.title} — review`);
            chip.type = "button";
            chip.addEventListener("click", () => showPane("proposals"));
            t.turn.insertBefore(chip, t.answer);
            loadProposals();
          } else if (kind === "error") failed = ev.message;
          else if (kind === "done") finished = true;
        }
      }
    } catch (err) {
      failed = err.name === "AbortError" ? "stopped" : err.message;
    }
    controller = null;
    send.textContent = "Ask"; send.classList.remove("stop"); send.disabled = !available;
    if (live) live.classList.remove("live");
    renderAnswer(t.answer, t.sources, text);
    t.steps.firstChild.textContent = `${nsteps} step${nsteps === 1 ? "" : "s"}`;
    t.steps.open = false;
    if (failed || !finished) t.turn.appendChild(el("div", "msg-error", failed || "the answer was cut off"));
    if (text.trim()) history.push({ role: "assistant", content: text });
    else history.pop();   // keep the history a clean user/assistant alternation
    scroll();
  }

  // ── wiring ──
  function showPane(id) {
    document.querySelectorAll(".ask-tab").forEach(b => b.classList.toggle("active", b.dataset.pane === id));
    log.hidden = id !== "ask-log";
    props.hidden = id !== "proposals";
    form.hidden = id !== "ask-log";
    if (id === "proposals") loadProposals();
  }
  document.querySelectorAll(".ask-tab").forEach(b => b.addEventListener("click", () => showPane(b.dataset.pane)));
  btn.addEventListener("click", () => {
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) { status(); loadProposals(); input.focus(); }
  });
  $("ask-close").addEventListener("click", () => panel.classList.remove("open"));
  $("ask-new").addEventListener("click", () => {
    if (controller) controller.abort();
    history = []; log.replaceChildren();
  });
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (controller) { controller.abort(); return; }
    const q = input.value.trim();
    if (!q || !available) return;
    input.value = ""; input.style.height = "";
    ask(q);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  status();
  loadProposals();
  setInterval(() => { status(); loadProposals(); }, 60000);
})();
</script>
</body>
</html>
