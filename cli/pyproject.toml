[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "schist"
version = "0.2.0"
description = "Agent-first knowledge graph: git is truth, SQLite is query, humans just watch"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND AGPL-3.0-or-later"
license-files = ["LICENSE.*"]
authors = [
    { name = "Yibei Chen" }
]
keywords = ["knowledge-graph", "agents", "mcp", "markdown", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["python-frontmatter>=1.1.0", "pyyaml>=6.0.3"]

[project.urls]
Homepage = "https://github.com/yibeichan/schist"
Repository = "https://github.com/yibeichan/schist"
Issues = "https://github.com/yibeichan/schist/issues"
Changelog = "https://github.com/yibeichan/schist/blob/main/CHANGELOG.md"

[project.scripts]
schist = "schist.__main__:main"
schist-ingest = "schist.ingest:main"
# Forced-command SSH wrapper pinning SCHIST_IDENTITY to an authorized key
# (issue #502). Must resolve on the PATH sshd uses on the hub host.
schist-shell = "schist.hub_shell:main"

# Explicit package list — without this, setuptools 82+ flat-layout
# auto-discovery fails when a local `cli/hooks/` directory exists (as
# created by test_rate_limit.py's `rejected-pushes.log`, which lands
# under cli/hooks/ by default even though the log file is gitignored).
# setuptools then errors with "Multiple top-level packages discovered in
# a flat-layout: ['hooks', 'schist']" because .gitignore is invisible
# to it. Pinning the package list makes the install deterministic
# regardless of stray local directories.
[tool.setuptools]
packages = ["schist", "schist.viewer"]

# Ship schema.sql inside the wheel so `schist-ingest` works after
# `pip install schist` — ingest.py reads schema.sql via
# Path(__file__).parent / 'schema.sql'.
# default.yaml is the canonical content-axis directory list, shipped
# inside the wheel as in-package data. Loaders (commands.py, rate_limit.py,
# and mcp-server tools.ts) resolve it via
# Path(__file__).parent / 'default.yaml' for both editable and wheel installs.
[tool.setuptools.package-data]
schist = ["*.sql", "default.yaml", "acl-fixtures/*.yaml", "acl-fixtures/*.json", "acl-fixtures/*.md"]
# The viewer page is copied next to graph.json by `schist build`.
"schist.viewer" = ["index.html"]

[tool.pytest.ini_options]
markers = [
    "integration: slow tests that spawn real git subprocesses",
    "reads_blobs: pre-receive tests that let the hook read pushed file content",
]
